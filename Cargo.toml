[package]
name = "cenv"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
description = "Single-binary Claude Code companion: incremental conversation capture to Markdown, one-call session summaries and CLAUDE.md rule distillation, and fail-closed config/memory sync"
license = "MIT"
repository = "https://github.com/cmacha2/cenv"
keywords = ["claude", "claude-code", "cli", "transcript", "history"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
jiff = "0.2.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strsim = "0.11.1"
toml = "1.1.4"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
